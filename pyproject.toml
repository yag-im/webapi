[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning"]

[project]
name = "webapi"
dynamic = ["version"]
description = "yag macroservices"
authors = [{ name = "yag-im" }]
keywords = ["signaling"]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "authlib>=1.9.1,<2",
    "fastapi>=0.142",
    "gunicorn>=23.0.0,<24",
    "httpx2>=2.13,<3",
    "itsdangerous>=2.2,<3",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13,<3",
    "python-dateutil",
    "requests>=2.34,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn[standard]>=0.54",
    "uvicorn-worker>=0.4",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
]
test = [
    "pytest",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["webapi"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["webapi/static"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "ANN",  # flake8-annotations
    "PL",   # pylint
]
ignore = [
    "E501",  # line length is handled by the formatter
    "ANN401",  # allow typing.Any
    "N818",  # exception names without Error suffix
    "PLR2004",  # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["webapi"]

[tool.pyright]
include = ["webapi"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-s -v"
markers = [
    "integration: marks integration tests",
    "unit: marks unittests"
]
testpaths = "tests"
