repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.21
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        args: [ --config=lint/.gitlint, --msg-filename ]
  # ruff and pyright run from the project venv so versions are pinned by uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [ python, pyi ]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [ python, pyi ]
        require_serial: true
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        types_or: [ python, pyi ]
        pass_filenames: false
